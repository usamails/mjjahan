<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#06080e" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="40%" stop-color="#06b6d4" />
      <stop offset="80%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Main Service Brand Icon Gradient -->
    <linearGradient id="servicePrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Growth Accent Gradient -->
    <linearGradient id="growthAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Glowing Node Gradient -->
    <linearGradient id="glowNode" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Drop Shadow Filter for Depth -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#06b6d4" flood-opacity="0.45" />
    </filter>

    <filter id="sparkGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#38bdf8" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Base App Tile -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="12" />

  <!-- Subtle Inner Service Grid Texture -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="2">
    <line x1="80" y1="160" x2="432" y2="160" stroke-dasharray="8 12" />
    <line x1="80" y1="256" x2="432" y2="256" stroke-dasharray="8 12" />
    <line x1="80" y1="352" x2="432" y2="352" stroke-dasharray="8 12" />
    <line x1="160" y1="80" x2="160" y2="432" stroke-dasharray="8 12" />
    <line x1="256" y1="80" x2="256" y2="432" stroke-dasharray="8 12" />
    <line x1="352" y1="80" x2="352" y2="432" stroke-dasharray="8 12" />
  </g>

  <!-- Service & Digital Growth Icon Geometry -->
  <g filter="url(#neonGlow)">
    <!-- Upward Growth Dynamic Arrow (Digital Marketing / Business Scaling) -->
    <path 
      d="M130 360 L215 275 L285 330 L395 180" 
      fill="none" 
      stroke="url(#growthAccent)" 
      stroke-width="26" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
    />
    
    <!-- Arrowhead at Top Right -->
    <path 
      d="M330 175 L405 170 L400 245" 
      fill="none" 
      stroke="url(#growthAccent)" 
      stroke-width="26" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
    />

    <!-- Stylized Monogram "J" (Jahan Ali) intersecting with the growth curve -->
    <path 
      d="M290 120 L350 120 M320 120 L320 310 C320 375 270 410 200 410 C145 410 110 380 98 340" 
      fill="none" 
      stroke="url(#servicePrimary)" 
      stroke-width="32" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
    />
  </g>

  <!-- Strategic Service Connection Nodes (SEO, Ads, Web, Travel) -->
  <circle cx="130" cy="360" r="16" fill="#090d16" stroke="url(#glowNode)" stroke-width="8" filter="url(#sparkGlow)" />
  <circle cx="215" cy="275" r="16" fill="#090d16" stroke="url(#glowNode)" stroke-width="8" filter="url(#sparkGlow)" />
  <circle cx="285" cy="330" r="16" fill="#090d16" stroke="url(#glowNode)" stroke-width="8" filter="url(#sparkGlow)" />
  
  <!-- Glowing Marketing Spark at Apex -->
  <polygon 
    points="405,150 415,165 435,168 420,182 423,200 405,190 387,200 390,182 375,168 395,165" 
    fill="#38bdf8" 
    filter="url(#sparkGlow)" 
  />
</svg>
